name: vigil

services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"  # лише для розробки з хоста (5432 часто зайнятий локальним PostgreSQL); назовні не відкрито
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigil}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vigil}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}@db:5432/${POSTGRES_DB:-vigil}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      start_period: 30s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}  # решта .env (секрети бекенда) Caddy не потрібна
    ports:
      - "80:80"    # редирект на HTTPS і перевірка Let's Encrypt
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data  # сертифікати: без цього кожен перезапуск випрошував би новий
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  dbdata:
  caddy_data:
