<title>Прототип Vigil</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: робочий застосунок — бічне меню + робоча область; на телефоні меню виїжджає зверху.
   Колір дій — синій; кольори станів (ok / warn / crit / off / ack) — окрема семантична шкала. */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #eef2f8; --border: #dbe2ec; --border-strong: #c5cfdd;
  --fg: #0f1b2d; --muted: #5a6a80; --faint: #66768b;
  --accent: #1d5fd8; --accent-hover: #164db3; --accent-weak: #e7effd; --accent-fg: #ffffff;
  --ok: #157a3a; --ok-bg: #e3f4e8; --warn: #a65800; --warn-bg: #fff1d9; --crit: #c1261a; --crit-bg: #fde9e7; --crit-fg: #ffffff;
  --off: #66717f; --off-bg: #eceff3; --ack: #4446b8; --ack-bg: #ebebfb;
  --grid: #e7ecf3; --shadow: 0 1px 2px rgba(15, 27, 45, .06), 0 4px 16px rgba(15, 27, 45, .05);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b131f; --surface: #111b2a; --surface-2: #172335; --border: #24344a; --border-strong: #33465f;
  --fg: #e5ecf6; --muted: #98a8bd; --faint: #8797ac;
  --accent: #5c94ff; --accent-hover: #7aa8ff; --accent-weak: #15284a; --accent-fg: #07111f;
  --ok: #45c072; --ok-bg: #102b1b; --warn: #f2a640; --warn-bg: #36270e; --crit: #ff6a5c; --crit-bg: #3a1513; --crit-fg: #07111f;
  --off: #9aa5b3; --off-bg: #1f2a39; --ack: #9497ff; --ack-bg: #1e1f45;
  --grid: #1c2a3d; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b131f; --surface: #111b2a; --surface-2: #172335; --border: #24344a; --border-strong: #33465f;
  --fg: #e5ecf6; --muted: #98a8bd; --faint: #8797ac;
  --accent: #5c94ff; --accent-hover: #7aa8ff; --accent-weak: #15284a; --accent-fg: #07111f;
  --ok: #45c072; --ok-bg: #102b1b; --warn: #f2a640; --warn-bg: #36270e; --crit: #ff6a5c; --crit-bg: #3a1513; --crit-fg: #07111f;
  --off: #9aa5b3; --off-bg: #1f2a39; --ack: #9497ff; --ack-bg: #1e1f45;
  --grid: #1c2a3d; --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 24px; font-weight: 600; }
h2 { font-size: 18px; font-weight: 600; }
h3, .h3 { font-size: 15px; font-weight: 600; }
h1:focus { outline: none; }  /* фокус ставиться програмно після переходу (2) */
input, select, textarea { font-size: 16px; }  /* 5: 16 px — iPhone не масштабує сторінку при фокусі */
button, .chart-box, tr.click { touch-action: manipulation; }  /* 6: без затримки дотику */
.btn:active, .tcard:active, .alert-row:active, .nav-btn:active, .chip:active { transform: scale(.985); }  /* 6: відгук на натискання */
.skip { position: absolute; left: 16px; top: -80px; z-index: 40; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: var(--r); padding: 10px 14px; font-weight: 600; }
.skip:focus { top: calc(12px + env(safe-area-inset-top, 0px)); }  /* 1 */
.req { color: var(--crit); }
.err { color: var(--crit); font-size: 13px; }
[aria-invalid="true"] { border-color: var(--crit) !important; }
.pw { display: flex; gap: 6px; } .pw input { flex: 1; min-width: 0; } .pw-toggle { flex: none; border: 1px solid var(--border-strong); background: var(--surface); border-radius: var(--r); padding: 0 12px; font-size: 13px; color: var(--accent); min-height: 44px; }
.search-wrap { position: relative; flex: 1 1 220px; min-width: 0; }
.sr { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 25; list-style: none; margin: 0; padding: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
.sr li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 6px; cursor: pointer; }
.sr li[aria-selected="true"], .sr li:hover { background: var(--accent-weak); }
.th-sort { border: 0; background: none; padding: 0; font: inherit; color: inherit; text-transform: inherit; letter-spacing: inherit; display: inline-flex; gap: 4px; align-items: center; }
.th-sort:hover { color: var(--fg); }
.backdrop { position: fixed; inset: 0; z-index: 30; background: rgb(15 27 45 / .45); display: grid; place-items: center; padding: 16px; }
.modal { width: 100%; max-width: 460px; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: var(--crit-fg); }
textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); resize: vertical; font: inherit; }
.chart-box { touch-action: pan-y; }  /* 7: вертикальна прокрутка лишається, горизонтальний рух веде підказку */
p { margin: 0; }
.num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 500; }

/* ---------- каркас ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 20px; min-height: 100%; max-width: 1480px; margin-inline: auto;  /* 9 */
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.side { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); align-self: start; display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 700; font-size: 18px; }
.brand svg { flex: none; }
.nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: var(--r); text-align: left; color: var(--muted); font-weight: 500; }
.nav-btn:hover { background: var(--surface-2); color: var(--fg); }
.nav-btn[aria-current="page"] { background: var(--accent-weak); color: var(--accent); }
.nav-btn .count { margin-left: auto; background: var(--crit); color: #fff; border-radius: 10px; font-size: 12px; padding: 0 7px; font-weight: 600; }
.nav-sep { height: 1px; background: var(--border); margin: 10px 4px; }
.proto-note { margin-top: 18px; padding: 10px; border: 1px dashed var(--border-strong); border-radius: var(--r); font-size: 12px; color: var(--muted); }
.main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.topbar .search { width: 100%; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 7px 12px; color: var(--muted); }
.topbar .search input { border: 0; outline: 0; background: none; width: 100%; min-width: 0; }
.live { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: beat 2s infinite; }
.icon-btn { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: var(--r); border: 1px solid var(--border); background: var(--surface); }
.icon-btn:hover { border-color: var(--border-strong); }
.avatar { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--accent-weak); color: var(--accent); font-weight: 600; font-size: 14px; }
.menu-btn { display: none; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 70%, 100% { box-shadow: 0 0 0 7px transparent; } }

/* ---------- базові блоки ---------- */
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--r) + 2px); }
.panel-pad { padding: 18px; }
.panel-head { display: flex; align-items: center; gap: 12px; justify-content: space-between; flex-wrap: wrap; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 6px; }
.btn[disabled] { opacity: .5; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .03em; text-transform: uppercase; padding: 10px 18px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 11px 18px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
.grid { display: grid; gap: 16px; }

/* ---------- стани ---------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.badge svg { flex: none; }
.s-ok { color: var(--ok); background: var(--ok-bg); }
.s-warn { color: var(--warn); background: var(--warn-bg); }
.s-crit { color: var(--crit); background: var(--crit-bg); }
.s-off { color: var(--off); background: var(--off-bg); }
.s-ack { color: var(--ack); background: var(--ack-bg); }
.s-sup { color: var(--off); background: repeating-linear-gradient(135deg, var(--off-bg) 0 6px, transparent 6px 10px); border: 1px solid var(--border); }
.stripe { border-left: 4px solid var(--border-strong); }
.stripe.crit { border-left-color: var(--crit); } .stripe.warn { border-left-color: var(--warn); } .stripe.off { border-left-color: var(--off); } .stripe.ok { border-left-color: var(--ok); }
@media (prefers-reduced-motion: no-preference) { .pulse { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .55; } }

/* ---------- дашборд ---------- */
.alert-strip { display: flex; flex-direction: column; }
.alert-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.alert-row:first-child { border-top: 0; }
.alert-row:hover { background: var(--surface-2); }
.alert-row .what { min-width: 0; }
.alert-row .what b { font-weight: 600; }
.alert-row .why { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.tile { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.tile .val { font-family: var(--mono); font-size: 26px; font-weight: 500; font-variant-numeric: tabular-nums; }
.tile .val small { font-size: 15px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.tcard { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; text-align: left; border-radius: calc(var(--r) + 2px); border: 1px solid var(--border); background: var(--surface); width: 100%; }
.tcard:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.tcard .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.tcard .name { font-weight: 600; overflow-wrap: anywhere; }
.tcard .kind { font-size: 12px; color: var(--muted); }
.mets { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.met { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.met .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.met .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.met .v.crit { color: var(--crit); font-weight: 500; } .met .v.warn { color: var(--warn); font-weight: 500; }
.spark { width: 100%; height: 28px; display: block; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--surface); padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); color: var(--accent); font-weight: 600; }

/* ---------- графіки ---------- */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--grid); stroke-width: 1; }
.chart .ax { fill: var(--faint); font: 11px var(--mono); }
.chart .ln { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.chart .ar { fill: var(--accent); opacity: .08; }
.chart .tw { stroke: var(--warn); stroke-dasharray: 5 4; stroke-width: 1.3; }
.chart .tc { stroke: var(--crit); stroke-dasharray: 5 4; stroke-width: 1.3; }
.chart .tl { font: 11px var(--mono); }
.chart .tl.w { fill: var(--warn); } .chart .tl.c { fill: var(--crit); }
.chart .over { fill: var(--crit); opacity: .1; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .mark { stroke: var(--crit); stroke-width: 1.3; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.chart-card { padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.chart-card .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.chart-card .now { font-family: var(--mono); font-size: 20px; font-variant-numeric: tabular-nums; }

/* ---------- інцидент ---------- */
.inc-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.diag { border: 1px solid var(--border); border-radius: calc(var(--r) + 2px); background: var(--surface); overflow: hidden; }
.diag .cause { padding: 18px; background: var(--accent-weak); display: flex; flex-direction: column; gap: 6px; }
.diag .cause h2 { font-size: 20px; }
.diag .rec { padding: 14px 18px; border-top: 1px solid var(--border); display: flex; gap: 12px; }
.ev { list-style: none; margin: 0; padding: 4px 0; }
.ev li { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 9px 18px; border-top: 1px solid var(--border); }
.ev .ok { color: var(--ok); font-weight: 700; } .ev .no { color: var(--faint); font-weight: 700; }
.ev .val { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.alt { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.timeline { list-style: none; margin: 0; padding: 6px 18px 14px; position: relative; }
.timeline li { display: grid; grid-template-columns: 54px 14px minmax(0, 1fr); gap: 10px; padding: 8px 0; align-items: baseline; }
.timeline .t { font-family: var(--mono); color: var(--muted); font-size: 13px; }
.timeline .d { width: 10px; height: 10px; border-radius: 50%; background: var(--border-strong); position: relative; top: 1px; }
.timeline .d.crit { background: var(--crit); } .timeline .d.ok { background: var(--ok); } .timeline .d.ack { background: var(--ack); } .timeline .d.acc { background: var(--accent); }
.tg { display: flex; flex-direction: column; gap: 8px; padding: 14px 18px; background: var(--surface-2); }
.tg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-size: 14px; max-width: 360px; }
.tg-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; max-width: 360px; }
.tg-btns span { text-align: center; padding: 7px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 13px; color: var(--accent); }
.supp { padding: 10px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- майстер ---------- */
.steps { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; flex-wrap: wrap; }
.steps li { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.steps li b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong); font-size: 13px; }
.steps li.on { color: var(--fg); font-weight: 600; } .steps li.on b { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.steps li.done b { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.steps .sep { width: 28px; height: 1px; background: var(--border-strong); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field input, .field select { padding: 9px 12px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); width: 100%; min-height: 44px; }
.field .hint { font-size: 13px; color: var(--muted); }
.form { display: grid; gap: 14px; max-width: 520px; }
.cmd { display: flex; gap: 10px; align-items: flex-start; background: #0f1b2d; color: #d8e3f5; border-radius: var(--r); padding: 12px 14px; }
.cmd code { flex: 1; min-width: 0; font: 13px/1.6 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }  /* 10 */
.cmd button { flex: none; background: #22324a; border: 1px solid #33465f; color: #d8e3f5; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
.wait { display: flex; align-items: center; gap: 14px; padding: 18px; border: 1px dashed var(--border-strong); border-radius: var(--r); }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-weak); border-top-color: var(--accent); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin, .live i { animation: none; } }

/* ---------- налаштування ---------- */
.switch { position: relative; width: 38px; height: 22px; border-radius: 11px; border: 0; background: var(--border-strong); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { left: 19px; }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 18px; border-top: 1px solid var(--border); }
.rule:first-child { border-top: 0; }
.cond { font-family: var(--mono); font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }

/* ---------- вхід ---------- */
.auth { min-height: 100%; display: grid; place-items: center; padding-block: 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.auth .box { width: 100%; max-width: 400px; padding: 28px; display: flex; flex-direction: column; gap: 18px; }

/* ---------- сповіщення-тост ---------- */
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); padding: 11px 16px; border-radius: var(--r); font-size: 14px; box-shadow: var(--shadow); max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }

function chartBlock(id, data, opt) {

  const sum = `за період: мін ${fmt(mn)}, макс ${fmt(mx)}, зараз ${fmt(last(data))} ${opt.unit || "%"}` + (opt.crit != null ? (over ? `, вище критичного порогу ${over} хв` : ", критичний поріг не перевищено") : "");

function chart(data, { warn, crit, unit = "%", max = 100, labels, markLabel }, store) {
  // 8: на вузькому екрані — вужчий viewBox, менше поділок; інакше підписи стискаються до ~6 px
  const narrow = innerWidth < 600;
  const W = narrow ? 340 : 560, H = narrow ? 220 : 200, L = narrow ? 34 : 40, R = narrow ? 40 : 46, T = 22, B = 24, iw = W - L - R, ih = H - T - B;
  if (store) store.dims = { W, L, iw };
  if (narrow && labels) labels = [labels[0], labels[Math.floor(labels.length / 2)], labels[labels.length - 1]];
  const x = i => L + i / (data.length - 1) * iw, y = v => T + ih - v / max * ih;
  const grid = (narrow ? [0, .5, 1] : [0, .25, .5, .75, 1]).map(f => { const v = max * f, yy = y(v);
    return `<line class="gl" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 8}" y="${yy + 4}" text-anchor="end">${Math.round(v)}</text>`; }).join("");
  const pts = data.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  let over = "";
  if (crit != null) data.forEach((v, i) => { if (v > crit && i < data.length - 1) over += `<rect class="over" x="${x(i)}" y="${T}" width="${(iw / (data.length - 1)).toFixed(2)}" height="${ih}"/>`; });
  const thr = (val, cls, txt) => val == null ? "" : `<line class="${cls}" x1="${L}" x2="${W - R}" y1="${y(val)}" y2="${y(val)}"/><text class="tl ${cls === "tw" ? "w" : "c"}" x="${W - R + 6}" y="${y(val) + 4}">${txt}</text>`;
  const lbl = (labels || ["-60 хв", "-45", "-30", "-15", "зараз"]).map((t, k, arr) => `<text class="ax" x="${L + k / (arr.length - 1) * iw}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === arr.length - 1 ? "end" : "middle"}">${t}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" aria-hidden="true" focusable="false"><text class="ax" x="${L - 8}" y="12" text-anchor="end">${esc(unit)}</text>${grid}${over}
    <polygon class="ar" points="${L},${T + ih} ${pts.join(" ")} ${W - R},${T + ih}"/>
    <polyline class="ln" points="${pts.join(" ")}"/>${thr(warn, "tw", "попер.")}${thr(crit, "tc", "крит.")}
    <circle class="dot" cx="${x(data.length - 1)}" cy="${y(last(data))}" r="3.5"/>${lbl}${anomaly()}
    <line class="cursor" x1="0" x2="0" y1="${T}" y2="${T + ih}" visibility="hidden"/></svg>`;
  // 7: перетин критичного порогу — вертикальна мітка, маркер і підпис, а не лише колір
  function anomaly() {
    if (crit == null) return "";
    let k = -1; for (let i = data.length - 1; i > 0; i--) { if (data[i] > crit && data[i - 1] <= crit) { k = i; break; } }
    if (k < 0) return "";
    const xx = x(k), right = xx > L + iw * .7;
    return `<line class="anom-l" x1="${xx}" x2="${xx}" y1="${T}" y2="${T + ih}"/><circle class="anom" cx="${xx}" cy="${y(data[k])}" r="4.5"/>
      <text class="anom-t" x="${right ? xx - 6 : xx + 6}" y="${T + 12}" text-anchor="${right ? "end" : "start"}">${esc(markLabel || "поріг перетнуто")}</text>`;
  }
}

function uptimeSegs(t) {

  if (t.status === "crit") { seg[46] = "crit"; seg[47] = "crit"; seg[31] = "warn"; }

  if (t.status === "off") seg[47] = "off";

}

  else if (d.stab) { S.settingsTab = d.stab; render(); }
  else if (d.wiz) { S.wizStep = +d.wiz; S.wizDone = false; render(); if (S.wizStep === 3) setTimeout(() => { if (S.view === "add" && S.wizStep === 3) { S.wizDone = true; S.empty = false; render(); } }, 3200); }
  else if (d.ack) { const i = INCIDENTS.find(x => x.id === d.ack); i.status = "ack"; i.ackBy = "Ростислав К."; i.timeline.push({ t: "14:17", c: "ack", text: "Підтвердив Ростислав К." }); render(); toast("Інцидент підтверджено — колеги бачать, що ви займаєтеся"); }
  else if (d.close) { S.closing = d.close; render(); }
  else if (d.modal === "cancel") { S.closing = null; render(); $("#closebtn")?.focus(); }

    const text = $("#cm").value.trim();
    if (!setErr("cm", text ? "" : "Напишіть, чому закриваєте інцидент — це побачать колеги")) { $("#cm").focus(); return; }
    const i = INCIDENTS.find(x => x.id === S.closing); i.status = "closed"; i.timeline.push({ t: "14:18", c: "ok", text: "Закрито вручну: " + text });
    S.closing = null; render(); toast("Інцидент закрито");
  }
  else if (d.res) openResult(d.res);
  else if (d.sort) { const [t, k] = d.sort.split(":"), st = S.sort[t]; S.sort[t] = { key: k, dir: st.key === k ? -st.dir : 1 }; render(); $(`[data-sort="${d.sort}"]`)?.focus(); }
  else if (d.rule) { const r = RULES[+d.rule]; r.on = !r.on; render(); toast(r.on ? "Правило ввімкнено" : "Правило вимкнено"); }
  else if (d.toast) toast(d.toast);
  else if (el.id === "menu") { S.menu = !S.menu; render(); }
  else if (el.id === "pause") { S.paused = !S.paused; if (!S.paused) S.lastUpdate = Date.now(); render(); $("#pause")?.focus(); toast(S.paused ? "Оновлення призупинено" : "Оновлення відновлено"); }
  else if (el.id === "newuser") go("dashboard", { empty: true });
  else if (el.id === "simrun") simStart();
  else if (el.id === "simfix") { SIM.fixing = true; SIM.step = 4; paintSim(); }
  else if (el.id === "tgx") $("#tg").innerHTML = "";
  else if (el.id === "skip") $("#main-content").focus();
  else if (el.id === "pwt") { const pw = $("#pw"), show = pw.type === "password"; pw.type = show ? "text" : "password"; el.setAttribute("aria-pressed", show); el.textContent = show ? "Сховати" : "Показати"; }
  else if (el.id === "theme") { const r = document.documentElement; r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark"; }
  else if (el.id === "copy") {
    const txt = $("#cmdtxt").textContent;
    const sel = () => { const rg = document.createRange(); rg.selectNodeContents($("#cmdtxt")); const s = getSelection(); s.removeAllRanges(); s.addRange(rg); toast("Команду виділено — натисніть Ctrl+C"); };
    try { navigator.clipboard.writeText(txt).then(() => toast("Команду скопійовано"), sel); } catch (err) { sel(); }
  }
});
function setErr(id, msg) {  // 12: помилка під полем, зв'язана через aria-describedby
  const inp = $("#" + id), err = $("#" + id + "-err");
  inp.setAttribute("aria-invalid", msg ? "true" : "false"); err.textContent = msg || ""; err.hidden = !msg;
  return !msg;
}
document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "login") {
    const ok = [setErr("em", /^\S+@\S+\.\S+$/.test($("#em").value.trim()) ? "" : "Введіть email у форматі name@example.ua"),
                setErr("pw", $("#pw").value ? "" : "Введіть пароль")];
    if (ok.every(Boolean)) go("dashboard"); else $("[aria-invalid=true]").focus();
  }
  if (e.target.id === "wiz1") {
    const name = $("#srv").value.trim(), ping = $("#ping").value.trim();
    const ok = [setErr("srv", name ? "" : "Вкажіть назву сервера — так він називатиметься на дашборді"),
                setErr("ping", !ping || /^(\d{1,3}\.){3}\d{1,3}$|^[a-z0-9.-]+\.[a-z]{2,}$/i.test(ping) ? "" : "Вкажіть IP-адресу (наприклад, 20.51.12.11) або доменне ім’я")];
    if (!ok.every(Boolean)) { $("[aria-invalid=true]").focus(); return; }
    S.wizName = name; S.wizOs = $("#os").value; S.wizStep = 2; render();
  }
});
// 15: пошук показує список — нікуди не перекидає, доки користувач не вибере результат
function searchResults(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const t = TARGETS.filter(x => (x.name + " " + x.kind).toLowerCase().includes(q)).map(x => ({ key: "t:" + x.id, name: x.name, sub: x.kind }));
  const i = INCIDENTS.filter(x => (x.id + " " + x.target + " " + x.cause).toLowerCase().includes(q)).map(x => ({ key: "i:" + x.id, name: x.id + " · " + x.target, sub: x.cause }));
  return [...t, ...i].slice(0, 7);
}
function paintSearch(res, sel) {
  const ul = $("#sr"), q = $("#q");
  if (!res) { ul.hidden = true; q.setAttribute("aria-expanded", "false"); q.removeAttribute("aria-activedescendant"); return; }
  ul.hidden = false; q.setAttribute("aria-expanded", "true");
  ul.innerHTML = res.length ? res.map((x, k) => `<li role="option" id="sr-${k}" data-res="${x.key}" aria-selected="${k === sel}"><span>${esc(x.name)}</span><span class="small muted">${esc(x.sub)}</span></li>`).join("")
    : `<li role="option" aria-disabled="true" class="muted">Нічого не знайдено</li>`;
  if (res.length && sel >= 0) q.setAttribute("aria-activedescendant", "sr-" + sel); else q.removeAttribute("aria-activedescendant");
}
function openResult(key) { const [k, id] = key.split(":"); k === "t" ? go("object", { target: id, tab: "charts" }) : go("incident", { incident: id }); }
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  const v = e.target.value; paintSearch(v.trim() ? searchResults(v) : null, 0); S.qi = 0;
});
document.addEventListener("keydown", e => {
  if (e.target.id !== "q" || $("#sr").hidden) return;
  const res = searchResults(e.target.value);
  if (!res.length) { if (e.key === "Escape") paintSearch(null); return; }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); S.qi = ((S.qi || 0) + (e.key === "ArrowDown" ? 1 : -1) + res.length) % res.length; paintSearch(res, S.qi); }
  else if (e.key === "Enter" && res[S.qi || 0]) { e.preventDefault(); openResult(res[S.qi || 0].key); }
  else if (e.key === "Escape") paintSearch(null);
});
document.addEventListener("pointerdown", e => { if (!e.target.closest?.(".search-wrap") && $("#sr") && !$("#sr").hidden) paintSearch(null); });

// живе оновлення: нові точки метрик кожні 3 с на дашборді й сторінці об’єкта
// 1: оновлюються лише числа й графіки на місці — фокус і позиція читання не збиваються
setInterval(() => {
  if (S.paused) return;
  const r = seeded(Date.now() % 100000);
  TARGETS.forEach(t => { if (!t.m) return; for (const k in t.m) { const a = t.m[k]; const v = last(a) + (r() - .5) * (k === "disk" ? .3 : 4); a.push(Math.max(0, Math.min(100, v))); a.shift(); } });
  NETDATA.push(Math.max(0, last(NETDATA) + (r() - .5) * 8)); NETDATA.shift();
  S.lastUpdate = Date.now();
  if (S.loading) return;
  document.querySelectorAll("[data-v]").forEach(el => { const [id, k] = el.dataset.v.split(":"); el.textContent = fmt(last(targetById(id).m[k])) + "%"; });
  document.querySelectorAll("[data-sp]").forEach(el => { const t = targetById(el.dataset.sp); el.innerHTML = spark(t.m.cpu, t.status); });
  document.querySelectorAll("[data-now]").forEach(el => { const c = CHARTS[el.dataset.now]; if (c) el.textContent = fmt(last(c.data)) + " " + c.unit; });
  document.querySelectorAll("[data-chwrap]").forEach(w => {
    if (w.contains(document.activeElement) || w.matches(":hover")) return;
    const id = w.dataset.chwrap; if (id.startsWith("inc:")) return;
    const card = w.closest(".chart-card"), title = card.querySelector("h2, h3").textContent;
    const thr = { cpu: [80, 95], ram: [85, 95], disk: [85, 95], net: [null, null] }[id.split(":")[1]];
    w.outerHTML = chartBlock(id, CHARTS[id].data, { warn: thr[0], crit: thr[1], unit: CHARTS[id].unit, title, labels: RANGE_LABELS[S.range] });
  });
  paintLive();
}, 3000);

// 8: підказка з точним значенням — мишею та стрілками з клавіатури
function showTip(box, i) {
  const c = CHARTS[box.dataset.ch]; if (!c) return;
  const n = c.data.length; i = Math.max(0, Math.min(n - 1, i)); box.dataset.i = i;
  const svg = box.querySelector("svg"), rect = svg.getBoundingClientRect(), dm = c.dims, vx = dm.L + i / (n - 1) * dm.iw;
  const tip = box.querySelector(".tip"); tip.hidden = false;
  tip.textContent = `${ago(i, n)} · ${fmt(c.data[i])} ${c.unit}`;
  tip.style.left = (vx / dm.W * rect.width) + "px";
  const cur = svg.querySelector(".cursor"); cur.setAttribute("x1", vx); cur.setAttribute("x2", vx); cur.setAttribute("visibility", "visible");
}
function hideTip(box) { box.querySelector(".tip").hidden = true; box.querySelector(".cursor")?.setAttribute("visibility", "hidden"); }
function tipAt(e) {
  const box = e.target.closest?.(".chart-box");
  if (!box) { if (e.type === "pointerdown") document.querySelectorAll(".chart-box").forEach(hideTip); return; }
  const c = CHARTS[box.dataset.ch], rect = box.querySelector("svg").getBoundingClientRect(), dm = c.dims;
  const vx = (e.clientX - rect.left) / rect.width * dm.W;
  showTip(box, Math.round((vx - dm.L) / dm.iw * (c.data.length - 1)));
}
document.addEventListener("pointermove", tipAt);
document.addEventListener("pointerdown", tipAt);  // дотик показує значення й лишає підказку до наступного дотику
document.addEventListener("pointerout", e => {
  if (e.pointerType === "touch") return;
  const box = e.target.closest?.(".chart-box"); if (box && !box.contains(e.relatedTarget)) hideTip(box);
});
let wasNarrow = innerWidth < 600;
addEventListener("resize", () => { clearTimeout(tipAt.h); tipAt.h = setTimeout(() => { if ((innerWidth < 600) !== wasNarrow) { wasNarrow = !wasNarrow; render(); } }, 200); });
document.addEventListener("focusin", e => { if (e.target.matches?.(".chart-box")) showTip(e.target, CHARTS[e.target.dataset.ch].data.length - 1); });
document.addEventListener("focusout", e => { if (e.target.matches?.(".chart-box")) hideTip(e.target); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.closing) { S.closing = null; render(); $("#closebtn")?.focus(); return; }
  const box = document.activeElement; if (!box?.matches(".chart-box")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { e.preventDefault(); showTip(box, +box.dataset.i + (e.key === "ArrowLeft" ? -1 : 1)); }
});

// ===== симулятор збою =====
// Етапи збігаються з життєвим циклом інциденту із записки: відхилення → інцидент → ескалація → відновлення → закриття
const SIM_STEPS = ["Норма", "Виявлено відхилення", "Відкрито інцидент", "Критичний рівень", "Відновлення", "Інцидент закрито"];
const SIM = { step: 0, tick: 0, v: 0, timer: null, fixing: false, above: 0, below: 0 };
const SIM_ID = "INC-143";
// 1 крок симуляції = 1 хв умовного часу, щоб «порушення тримається 2 хв» читалося правдоподібно
const simClock = () => new Date(NOW.getTime() + (4 + SIM.tick) * 60000).toTimeString().slice(0, 5);

function paintSim() {
  $("#simsteps").innerHTML = SIM_STEPS.map((x, k) => `<li class="${k < SIM.step ? "done" : k === SIM.step ? "now" : ""}"${k === SIM.step ? ' aria-current="step"' : ""}>${x}</li>`).join("");
  $("#simv").textContent = fmt(SIM.v || last(targetById("api-02").m.ram)) + " %";
  $("#simrun").disabled = !!SIM.timer;
  $("#simrun").textContent = SIM.step === 5 ? "Запустити знову" : "Запустити збій";
  $("#simfix").disabled = !(SIM.step === 2 || SIM.step === 3) || SIM.fixing;
}
// перемальовує екран, повертаючи фокус на той самий елемент; поки відкрито діалог — не чіпає, щоб не стерти коментар
function simRender() {
  if (S.closing || S.view === "login") return;
  const a = document.activeElement, key = a && $("#root").contains(a) ? (a.id ? "#" + a.id : Object.entries(a.dataset)[0]) : null;
  render();
  if (key) (typeof key === "string" ? $(key) : $(`[data-${key[0]}="${key[1]}"]`))?.focus({ preventScroll: true });
}
function tg(sev, title, text) {  // імітація повідомлення Telegram-бота; role=status озвучує його один раз
  $("#tg").innerHTML = `<div class="tg-card ${sev}"><div class="tg-head"><span>Telegram · @vigil_bot</span>
    <button class="tg-x" id="tgx" aria-label="Сховати сповіщення"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <b>${esc(title)}</b><p>${esc(text)}</p><div><button class="btn ghost" data-inc="${SIM_ID}">Відкрити інцидент</button></div></div>`;
  clearTimeout(tg.h);
  const hide = () => { const w = $("#tg"); if (w.matches(":hover") || w.contains(document.activeElement)) tg.h = setTimeout(hide, 3000); else w.innerHTML = ""; };
  tg.h = setTimeout(hide, 9000);
}
function simStart() {
  const k = INCIDENTS.findIndex(x => x.id === SIM_ID), t = targetById("api-02");
  if (k >= 0) INCIDENTS.splice(k, 1);
  t.status = "ok";
  Object.assign(SIM, { step: 0, tick: 0, v: last(t.m.ram), fixing: false, above: 0, below: 0 });
  clearInterval(SIM.timer); SIM.timer = setInterval(simTick, 1200);
  if (k >= 0) simRender();
  paintSim();
}
function simTick() {
  SIM.tick++;
  const t = targetById("api-02"), inc = INCIDENTS.find(x => x.id === SIM_ID), now = simClock();
  SIM.v = Math.max(0, Math.min(99.5, SIM.v + ((SIM.fixing ? 48 : 98) - SIM.v) * .22 + (Math.random() - .5)));
  t.m.ram.push(SIM.v);
  if (inc && inc.status !== "closed") { inc.value = fmt(SIM.v) + " %"; inc.age = (SIM.tick - SIM.openTick) + " хв"; }
  let changed = false;
  if (!SIM.fixing) {
    if (SIM.step === 0 && SIM.v > 85) { SIM.step = 1; SIM.devAt = now; SIM.devV = SIM.v; }
    else if (SIM.step === 1 && SIM.v > 85 && ++SIM.above >= 2) {
      SIM.step = 2; SIM.openTick = SIM.tick; t.status = "warn"; changed = true;
      INCIDENTS.unshift({ id: SIM_ID, sev: "warn", status: "open", target: "api-02", metric: "Використання RAM", value: fmt(SIM.v) + " %", threshold: "85 %",
        started: now, age: "0 хв", cause: "Нестача оперативної пам’яті",
        rec: "Пам’ять api-02 зростає вже кілька хвилин, а swap заповнюється. Знайдіть процес із найбільшим споживанням RAM (top, сортування за %MEM) — найчастіше це витік пам’яті після релізу. Перезапустіть сервіс або додайте серверу пам’яті.",
        evidence: [{ ok: true, text: "RAM api-02, середнє за 2 хв", val: fmt(SIM.v) + " % > 85 %" }, { ok: true, text: "Swap api-02", val: "62 % > 50 %" }],
        alt: [{ name: "Контейнер убито через нестачу пам’яті", score: "1 з 2 умов" }],
        timeline: [
          { t: SIM.devAt, c: "", text: "Виявлено відхилення: RAM " + fmt(SIM.devV) + " %" },
          { t: now, c: "crit", text: "Інцидент відкрито — порушення тримається 2 хв" },
          { t: now, c: "acc", text: "Визначено ймовірну причину: правило «Нестача оперативної пам’яті»" },
          { t: now, c: "acc", text: "Сповіщення надіслано в Telegram" }] });
      tg("warn", "Попередження · api-02", `Використання RAM ${fmt(SIM.v)} % (поріг 85 %). Ймовірна причина: нестача оперативної пам’яті.`);
    }
    else if (SIM.step === 2 && SIM.v > 95) {
      SIM.step = 3; t.status = "crit"; changed = true;
      if (inc.status !== "closed") {
        inc.sev = "crit"; inc.threshold = "95 %";
        inc.timeline.push({ t: now, c: "crit", text: "Рівень підвищено до критичного: RAM " + fmt(SIM.v) + " %" }, { t: now, c: "acc", text: "Сповіщення надіслано в Telegram" });
        tg("crit", "Критично · api-02", `RAM ${fmt(SIM.v)} % (поріг 95 %). Рівень інциденту ${SIM_ID} підвищено.`);
      }
    }
  } else if (SIM.v < 85 && ++SIM.below >= 2) {
    SIM.step = 5; t.status = "ok"; changed = true;
    clearInterval(SIM.timer); SIM.timer = null;
    if (inc.status !== "closed") {  // якщо вже закрили вручну — друге повідомлення не потрібне
      inc.status = "closed"; inc.ended = now;
      inc.timeline.push({ t: now, c: "ok", text: "RAM у нормі 2 хв поспіль — інцидент закрито автоматично" });
      tg("ok", "Вирішено · api-02", `RAM повернулася до ${fmt(SIM.v)} %. Інцидент ${SIM_ID} закрито автоматично.`);
    }
  }
  if (changed) simRender();
  paintSim();
}

// 3: якщо фокус потрапив під картку Telegram чи відкриту панель симулятора — прибираємо їх з дороги
document.addEventListener("focusin", e => {
  const a = e.target.getBoundingClientRect(), under = el => { const b = el.getBoundingClientRect(); return a.bottom > b.top && a.top < b.bottom && a.right > b.left && a.left < b.right; };
  const sim = $("#sim"), tgw = $("#tg");
  if (sim.open && !sim.contains(e.target) && under(sim)) sim.open = false;
  if (tgw.firstChild && !tgw.contains(e.target) && under(tgw)) tgw.innerHTML = "";
});

// тема за замовчуванням — світла (рішення для прототипу); посилання з #екраном відкриває його одразу
document.documentElement.dataset.theme = "light";
const start = fromToken((location.hash || "").slice(1));
if (start) Object.assign(S, start);
// popstate спрацьовує і на «Назад/Вперед», і на ручну зміну # в адресі
window.addEventListener("popstate", () => { const t = fromToken(location.hash.slice(1)); if (t && t.view !== "login") go(t.view, { ...t, closing: null }, true); });
render();
paintSim();
</script>
