server {
    listen 80;
    root /usr/share/nginx/html;

    # хешовані файли збірки кешуємо надовго, index.html – ні (інакше після оновлення лишиться стара версія)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;  # SPA: усі адреси віддають index.html, маршрутизує React Router
    }
}
