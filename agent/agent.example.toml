server   = "https://vigil-demo.westeurope.cloudapp.azure.com"
token    = "vgl_..."     # видається на сторінці об'єкта, показується один раз
host     = "web-01"      # рівно та назва, що в Vigil
interval = 15            # секунд, не менше 15
disks    = []            # наприклад ["C:", "D:"]; порожньо – усі
docker   = false         # true: моніторити Docker-контейнери цього сервера (лише читання, див. docs/DEPLOY.md)
# docker_url    = "tcp://127.0.0.1:2375"   # docker-socket-proxy; або "unix:///var/run/docker.sock"
# docker_ignore = ["test-*"]               # маски імен, які не моніторити; ще працює мітка vigil.ignore=true
