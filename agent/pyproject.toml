[project]
name = "vigil-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["psutil>=6.0", "httpx>=0.27"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]  # лише для агентів, що моніторять PostgreSQL
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
