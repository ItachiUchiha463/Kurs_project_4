name: Deploy

# Автоматично після успішного CI на main; або вручну (Actions -> Deploy -> Run workflow)
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false  # не перериваємо оновлення, що вже йде

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Оновити сервер по SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          APP_DIR: ${{ vars.DEPLOY_DIR || 'vigil' }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          install -m 600 /dev/null known_hosts && printf '%s\n' "$KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "cd $APP_DIR && git pull --ff-only && docker compose up -d --build && docker image prune -f"

      - name: Перевірити, що сервіс піднявся
        env:
          URL: ${{ vars.DEPLOY_URL }}
        run: |
          for i in $(seq 1 20); do
            curl -fsS "$URL/api/health" && exit 0
            sleep 6
          done
          echo "Сервіс не відповів на /api/health за 2 хвилини" && exit 1
