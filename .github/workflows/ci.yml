name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16  # той самий образ, що й у docker-compose.yml
        env:
          POSTGRES_USER: vigil
          POSTGRES_PASSWORD: vigil
          POSTGRES_DB: vigil
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vigil" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://vigil:vigil@localhost:5432/vigil  # тести самі створюють vigil_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[dev]"
      - run: python -m pytest -q
        working-directory: backend

  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: agent/pyproject.toml }
      - run: pip install -e "agent[dev]"
      - run: python -m pytest -q
        working-directory: agent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build

  installer:
    # install.sh ставить службу від root: поломку краще побачити до того, як її побачить користувач
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck agent/install.sh
      - run: sudo bash agent/install.sh --src-dir agent --no-service --server https://vigil.test --token vgl_ci --host ci-host
      - run: sudo /opt/vigil-agent/venv/bin/python -c "import tomllib; c = tomllib.load(open('/opt/vigil-agent/app/agent.toml', 'rb')); assert c['host'] == 'ci-host' and c['interval'] == 15"
      - run: sudo bash agent/install.sh --uninstall && test ! -e /opt/vigil-agent

  installer-windows:
    # install.ps1: агент як завдання Планувальника від SYSTEM; перевіряємо у Windows PowerShell 5.1, як у користувачів
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: .\agent\install.ps1 -SrcDir agent -Server https://vigil.test -Token vgl_ci -HostName ci-host
      - run: |
          $t = Get-ScheduledTask -TaskName VigilAgent
          if ($t.Principal.UserId -ne 'SYSTEM') { throw "task runs as $($t.Principal.UserId)" }
          $cfg = Join-Path $env:ProgramData 'VigilAgent\app\agent.toml'
          & (Join-Path $env:ProgramData 'VigilAgent\venv\Scripts\python.exe') -c "import sys, tomllib; c = tomllib.load(open(sys.argv[1], 'rb')); assert c['host'] == 'ci-host' and c['interval'] == 15" $cfg
          if ($LASTEXITCODE -ne 0) { throw 'agent.toml is wrong' }
      - run: |
          .\agent\install.ps1 -Uninstall
          if (Get-ScheduledTask -TaskName VigilAgent -ErrorAction SilentlyContinue) { throw 'task left' }
          if (Test-Path (Join-Path $env:ProgramData 'VigilAgent')) { throw 'folder left' }

  images:
    # Dockerfile'и й Compose ламаються тихо, доки їх не зберуть: краще дізнатися до деплою
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env  # docker-compose.yml читає env_file: .env, а в репозиторії лише зразок
      - run: POSTGRES_PASSWORD=ci docker compose config -q
      - run: POSTGRES_PASSWORD=ci docker compose build backend frontend
